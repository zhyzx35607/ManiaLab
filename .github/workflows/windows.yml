name: Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[portable]') }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MANIALAB_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PORTABLE_PROFILE: core
      # Core EXE checks run on tags, manual runs, and explicit portable requests.
      BUILD_PORTABLE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[portable]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[portable]')) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.1'
          enable-cache: true
      - name: Install locked application environment
        run: |
          uv venv .venv --python 3.12.10
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe requirements-lock.txt
      - name: Verify release tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = .venv/Scripts/python.exe -c "from manialab import __version__; print(__version__)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match source version $version."
          }
      - name: Test timing, LN selection, layout and project APIs
        run: |
          New-Item -ItemType Directory -Force test-data/release-ci | Out-Null
          .venv/Scripts/python.exe -m pytest -q --junitxml=test-data/release-ci/junit.xml
      - name: Fetch verified audio models
        if: env.BUILD_PORTABLE == 'true' && env.PORTABLE_PROFILE != 'core'
        run: .venv/Scripts/python.exe scripts/fetch_audio_models.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser checks
        # Browser checks are synthetic and do not depend on release models.
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx playwright install chromium
      - name: Test synthetic browser workflows
        id: browser_checks
        run: npm run test:ui
      - name: Save failed browser diagnostics
        if: always() && steps.browser_checks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/artifacts/browser
          retention-days: 7
          if-no-files-found: ignore
      - name: Install isolated audio environment
        if: env.BUILD_PORTABLE == 'true' && env.PORTABLE_PROFILE != 'core'
        run: |
          uv venv .venv-audio --python 3.12.10
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync --python .venv-audio/Scripts/python.exe --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match requirements-deep-lock.txt
      - name: Build and verify the fixed piano model
        id: piano_model
        if: env.BUILD_PORTABLE == 'true' && env.PORTABLE_PROFILE != 'core'
        run: .venv-audio/Scripts/python.exe scripts/fetch_piano_model.py --work "build/piano-model-$env:MANIALAB_BUILD_ID"
      - name: Save failed piano export diagnostics
        if: always() && steps.piano_model.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piano-export-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/piano-model-${{ github.run_id }}-${{ github.run_attempt }}/export-diagnostic.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Build portable audio worker
        if: env.BUILD_PORTABLE == 'true' && env.PORTABLE_PROFILE != 'core'
        run: .venv-audio/Scripts/python.exe scripts/build_audio_worker.py
      - name: Build declared Windows profile
        if: env.BUILD_PORTABLE == 'true'
        run: .venv/Scripts/python.exe scripts/build_windows.py --profile $env:PORTABLE_PROFILE
      - name: Verify actual EXE offline with clean PATH and Unicode data paths
        if: env.BUILD_PORTABLE == 'true'
        run: |
          $exe = "build/portable/$env:MANIALAB_BUILD_ID/dist/ManiaLab/ManiaLab.exe"
          .venv/Scripts/python.exe scripts/verify_portable.py $exe --work test-data/portable-ci
      - name: Verify portable process and worker shutdown behavior
        if: env.BUILD_PORTABLE == 'true'
        run: |
          $exe = "build/portable/$env:MANIALAB_BUILD_ID/dist/ManiaLab/ManiaLab.exe"
          .venv/Scripts/python.exe scripts/verify_shutdown.py $exe --work test-data/shutdown-ci
      - name: Collect release verification evidence
        if: success() && env.BUILD_PORTABLE == 'true'
        run: |
          .venv/Scripts/python.exe scripts/collect_release_validation.py `
            --build-root "build/portable/$env:MANIALAB_BUILD_ID" `
            --pytest-report test-data/release-ci/junit.xml `
            --portable-report test-data/portable-ci/report.json `
            --shutdown-report test-data/shutdown-ci/report.json
      - name: Save portable verification report
        if: always() && env.BUILD_PORTABLE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-verification
          path: |
            test-data/portable-ci/report.json
            test-data/portable-ci/launch-*.log
            test-data/shutdown-ci/report.json
            test-data/shutdown-ci/launch.log
            test-data/release-ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Save verified build
        if: success() && env.BUILD_PORTABLE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ManiaLab-windows-x64
          path: build/portable/${{ github.run_id }}-${{ github.run_attempt }}/release/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
