name: Windows validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[portable]') }}
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      MANIALAB_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PORTABLE_PROFILE: core
      # Core EXE checks run on tags, manual runs, and explicit portable requests.
      BUILD_PORTABLE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[portable]') || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[portable]')) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.1'
          enable-cache: true
      - name: Install locked application environment
        run: |
          uv venv .venv --python 3.12.10
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe requirements-lock.txt
      - name: Verify release tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = .venv/Scripts/python.exe -c "from manialab import __version__; print(__version__)"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match source version $version."
          }
      - name: Test timing, LN selection, layout and project APIs
        run: |
          New-Item -ItemType Directory -Force test-data/release-ci | Out-Null
          .venv/Scripts/python.exe -m pytest -q --junitxml=test-data/release-ci/junit.xml
      - name: Fetch verified audio models
        if: env.BUILD_PORTABLE == 'true' && env.PORTABLE_PROFILE != 'core'
        run: .venv/Scripts/python.exe scripts/fetch_audio_models.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked browser checks
        # Browser checks are synthetic and do not depend on release models.
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx playwright install chromium
      - name: Test synthetic browser workflows
        id: browser_checks
        run: npm run test:ui
      - name: Save failed browser diagnostics
        if: always() && steps.browser_checks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: tests/artifacts/browser
          retention-days: 7
          if-no-files-found: ignore
      - name: Install isolated audio environment
        if: env.BUILD_PORTABLE == 'true' && env.PORTABLE_PROFILE != 'core'
        run: |
          uv venv .venv-audio --python 3.12.10
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv pip sync --python .venv-audio/Scripts/python.exe --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match requirements-deep-lock.txt
      - name: Build and verify the fixed piano model
        id: piano_model
        if: env.BUILD_PORTABLE == 'true' && env.PORTABLE_PROFILE != 'core'
        run: .venv-audio/Scripts/python.exe scripts/fetch_piano_model.py --work "build/piano-model-$env:MANIALAB_BUILD_ID"
      - name: Save failed piano export diagnostics
        if: always() && steps.piano_model.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piano-export-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/piano-model-${{ github.run_id }}-${{ github.run_attempt }}/export-diagnostic.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Build portable audio worker
        if: env.BUILD_PORTABLE == 'true' && env.PORTABLE_PROFILE != 'core'
        run: .venv-audio/Scripts/python.exe scripts/build_audio_worker.py
      - name: Build declared Windows profile
        if: env.BUILD_PORTABLE == 'true'
        run: .venv/Scripts/python.exe scripts/build_windows.py --profile $env:PORTABLE_PROFILE
      - name: Verify actual EXE offline with clean PATH and Unicode data paths
        if: env.BUILD_PORTABLE == 'true'
        run: |
          $exe = "build/portable/$env:MANIALAB_BUILD_ID/dist/ManiaLab/ManiaLab.exe"
          .venv/Scripts/python.exe scripts/verify_portable.py $exe --work test-data/portable-ci
      - name: Verify packaged Core media playback and source switching
        if: env.BUILD_PORTABLE == 'true' && env.PORTABLE_PROFILE == 'core'
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "build/portable/$env:MANIALAB_BUILD_ID/dist/ManiaLab/ManiaLab.exe").Path
          $work = Join-Path $env:RUNNER_TEMP "manialab-core-media-$env:MANIALAB_BUILD_ID"
          $data = Join-Path $work 'data'
          $report = 'test-data/core-media-ci/report.json'
          $stdoutPath = 'test-data/core-media-ci/launch.stdout.log'
          $stderrPath = 'test-data/core-media-ci/launch.stderr.log'
          $serviceBindingPath = 'test-data/core-media-ci/service-binding.json'
          $probeStdoutPath = 'test-data/core-media-ci/probe.stdout.log'
          $probeStderrPath = 'test-data/core-media-ci/probe.stderr.log'
          if (Test-Path -LiteralPath $work) { throw "Core media data directory already exists: $work" }
          if (Test-Path -LiteralPath $report) { throw "Core media report already exists: $report" }
          if (Test-Path -LiteralPath $serviceBindingPath) { throw "Core media service binding already exists: $serviceBindingPath" }
          New-Item -ItemType Directory -Force -Path @($data, (Split-Path $report)) | Out-Null
          $portableRows = Get-Content 'test-data/portable-ci/report.json' -Raw | ConvertFrom-Json
          $identityRows = @($portableRows | Where-Object { $_.check -eq 'release_manifest' })
          if ($identityRows.Count -ne 1 -or $identityRows[0].build_profile -ne 'core') {
            throw 'Portable verification report has no unique Core release identity.'
          }
          $verificationRunId = $identityRows[0].verification_run_id
          if ($verificationRunId -notmatch '^[0-9a-f]{32}$') {
            throw 'Portable verification report has an invalid verification_run_id.'
          }
          $expectedVersion = .venv/Scripts/python.exe -c "from manialab import __version__; print(__version__)"
          if ($LASTEXITCODE) { throw 'Could not read the source version.' }
          $process = $null
          $processStarted = $false
          $stdoutTask = $null
          $stderrTask = $null
          $probeProcess = $null
          $probeStarted = $false
          $probeStdoutTask = $null
          $probeStderrTask = $null
          $stepFailure = $null
          $cleanupFailures = [System.Collections.Generic.List[string]]::new()
          function Add-CleanupFailure {
            param([string]$Operation, [scriptblock]$Action)
            try { & $Action } catch { [void]$cleanupFailures.Add("${Operation}: $($_.Exception.Message)") }
          }
          try {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $exe
            $startInfo.WorkingDirectory = Split-Path $exe
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            foreach ($argument in @('--no-browser', '--port', '0', '--data-dir', $data)) {
              $startInfo.ArgumentList.Add($argument)
            }
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) { throw 'Could not start the packaged Core EXE.' }
            $processStarted = $true
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()

            $marker = Join-Path $data 'current-url.txt'
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while (-not (Test-Path -LiteralPath $marker)) {
              $process.Refresh()
              if ($process.HasExited) { throw "Packaged Core EXE exited during startup ($($process.ExitCode))." }
              if ([DateTime]::UtcNow -ge $deadline) { throw 'Packaged Core startup marker timed out.' }
              Start-Sleep -Milliseconds 200
            }
            $baseUrl = (Get-Content -LiteralPath $marker -Raw).Trim()
            $uri = [Uri]::new($baseUrl, [UriKind]::Absolute)
            if ($uri.Scheme -ne 'http' -or $uri.Host -ne '127.0.0.1' -or
                $uri.Port -lt 1 -or $uri.Port -gt 65535 -or $uri.AbsolutePath -ne '/' -or
                $uri.Query -or $uri.Fragment -or $uri.UserInfo) {
              throw "Packaged Core wrote an invalid loopback URL: $baseUrl"
            }
            $ready = $false
            while (-not $ready) {
              $process.Refresh()
              if ($process.HasExited) { throw "Packaged Core EXE exited before HTTP readiness ($($process.ExitCode))." }
              try {
                $status = Invoke-RestMethod -Uri "$baseUrl/api/status" -TimeoutSec 3 -NoProxy -ErrorAction Stop
                $ready = $true
              } catch {
                if ([DateTime]::UtcNow -ge $deadline) { throw 'Packaged Core HTTP readiness timed out.' }
                Start-Sleep -Milliseconds 200
              }
            }
            if ($status.version -ne $expectedVersion) {
              throw "Packaged Core version $($status.version) differs from source $expectedVersion."
            }
            $listeners = @(Get-NetTCPConnection -State Listen -LocalPort $uri.Port -ErrorAction Stop)
            $foreignListeners = @($listeners | Where-Object { [int]$_.OwningProcess -ne $process.Id })
            $exeSha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            $binding = [ordered]@{
              schema = 1
              check = 'core_media_service_process_binding'
              status = if ($listeners.Count -gt 0 -and $foreignListeners.Count -eq 0) { 'running' } else { 'failed' }
              verification_run_id = $verificationRunId
              base_url = $baseUrl
              executable_sha256 = $exeSha256
              executable_pid = [int]$process.Id
              listeners_before = @($listeners | ForEach-Object {
                [ordered]@{
                  local_address = $_.LocalAddress
                  local_port = [int]$_.LocalPort
                  owning_process = [int]$_.OwningProcess
                }
              })
              listeners_after = @()
            }
            [IO.File]::WriteAllText(
              $serviceBindingPath,
              ($binding | ConvertTo-Json -Depth 5),
              [System.Text.UTF8Encoding]::new($false)
            )
            if ($listeners.Count -eq 0) {
              throw "No listening TCP socket was found for packaged Core port $($uri.Port)."
            }
            if ($foreignListeners.Count -gt 0) {
              throw "Core media URL port $($uri.Port) has a listener not owned by packaged Core PID $($process.Id)."
            }
            $node = Get-Command node -CommandType Application -ErrorAction Stop | Select-Object -First 1 -ExpandProperty Source
            $probeStartInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $probeStartInfo.FileName = $node
            $probeStartInfo.WorkingDirectory = (Get-Location).Path
            $probeStartInfo.UseShellExecute = $false
            $probeStartInfo.CreateNoWindow = $true
            $probeStartInfo.RedirectStandardOutput = $true
            $probeStartInfo.RedirectStandardError = $true
            $probeStartInfo.StandardOutputEncoding = [System.Text.UTF8Encoding]::new($false)
            $probeStartInfo.StandardErrorEncoding = [System.Text.UTF8Encoding]::new($false)
            foreach ($argument in @(
              'scripts/verify_core_media.cjs', '--base-url', $baseUrl, '--report', $report,
              '--executable', $exe, '--verification-run-id', $verificationRunId
            )) {
              $probeStartInfo.ArgumentList.Add($argument)
            }
            $probeProcess = [System.Diagnostics.Process]::new()
            $probeProcess.StartInfo = $probeStartInfo
            if (-not $probeProcess.Start()) { throw 'Could not start the Core media probe.' }
            $probeStarted = $true
            $probeStdoutTask = $probeProcess.StandardOutput.ReadToEndAsync()
            $probeStderrTask = $probeProcess.StandardError.ReadToEndAsync()
            if (-not $probeProcess.WaitForExit(120000)) {
              throw 'Core media probe timed out after 120 seconds.'
            }
            $probeProcess.WaitForExit()
            if ($probeProcess.ExitCode -ne 0) {
              throw "Core media probe failed with exit code $($probeProcess.ExitCode)."
            }
            $process.Refresh()
            if ($process.HasExited) {
              throw "Packaged Core EXE exited during media verification ($($process.ExitCode))."
            }
            $listenersAfter = @(Get-NetTCPConnection -State Listen -LocalPort $uri.Port -ErrorAction Stop)
            $foreignListenersAfter = @($listenersAfter | Where-Object { [int]$_.OwningProcess -ne $process.Id })
            $binding['listeners_after'] = @($listenersAfter | ForEach-Object {
              [ordered]@{
                local_address = $_.LocalAddress
                local_port = [int]$_.LocalPort
                owning_process = [int]$_.OwningProcess
              }
            })
            $binding['status'] = if ($listenersAfter.Count -gt 0 -and $foreignListenersAfter.Count -eq 0) { 'passed' } else { 'failed' }
            [IO.File]::WriteAllText(
              $serviceBindingPath,
              ($binding | ConvertTo-Json -Depth 5),
              [System.Text.UTF8Encoding]::new($false)
            )
            if ($listenersAfter.Count -eq 0) {
              throw "No listening TCP socket remained for packaged Core port $($uri.Port) after media verification."
            }
            if ($foreignListenersAfter.Count -gt 0) {
              throw "Core media URL port $($uri.Port) has a listener not owned by packaged Core PID $($process.Id) after media verification."
            }
          }
          catch { $stepFailure = $_ }
          finally {
            Add-CleanupFailure 'Core media probe process cleanup' {
              if ($processStarted) {
                if ($probeStarted) {
                  $probeProcess.Refresh()
                  if (-not $probeProcess.HasExited) {
                    try { $probeProcess.Kill($true) } catch {
                      $probeProcess.Refresh()
                      if (-not $probeProcess.HasExited) { throw }
                    }
                    if (-not $probeProcess.WaitForExit(15000)) {
                      throw 'Could not stop the Core media probe process tree during cleanup.'
                    }
                  }
                  $probeProcess.Refresh()
                  if (-not $probeProcess.HasExited) { throw 'Core media probe remained alive after cleanup.' }
                }
              }
            }
            Add-CleanupFailure 'Core media probe stdout log capture' {
              if ($null -ne $probeStdoutTask) {
                if (-not $probeStdoutTask.Wait(5000)) { throw 'Core media probe stdout did not close.' }
                [IO.File]::WriteAllText($probeStdoutPath, $probeStdoutTask.GetAwaiter().GetResult())
              }
            }
            Add-CleanupFailure 'Core media probe stderr log capture' {
              if ($null -ne $probeStderrTask) {
                if (-not $probeStderrTask.Wait(5000)) { throw 'Core media probe stderr did not close.' }
                [IO.File]::WriteAllText($probeStderrPath, $probeStderrTask.GetAwaiter().GetResult())
              }
            }
            Add-CleanupFailure 'Core media probe process dispose' {
              if ($null -ne $probeProcess) { $probeProcess.Dispose() }
            }
            Add-CleanupFailure 'Core EXE process cleanup' {
              if ($processStarted) {
                $process.Refresh()
                if (-not $process.HasExited) {
                  try { $process.Kill($true) } catch {
                    $process.Refresh()
                    if (-not $process.HasExited) { throw }
                  }
                  if (-not $process.WaitForExit(15000)) {
                    throw 'Could not stop the Core EXE started by the media verification step.'
                  }
                }
                $process.Refresh()
                if (-not $process.HasExited) { throw 'Core EXE remained alive after cleanup.' }
              }
            }
            Add-CleanupFailure 'Core EXE stdout log capture' {
              if ($null -ne $stdoutTask) {
                if (-not $stdoutTask.Wait(5000)) { throw 'Core EXE stdout did not close; launch log was not written.' }
                [IO.File]::WriteAllText($stdoutPath, $stdoutTask.GetAwaiter().GetResult())
              }
            }
            Add-CleanupFailure 'Core EXE stderr log capture' {
              if ($null -ne $stderrTask) {
                if (-not $stderrTask.Wait(5000)) { throw 'Core EXE stderr did not close; launch log was not written.' }
                [IO.File]::WriteAllText($stderrPath, $stderrTask.GetAwaiter().GetResult())
              }
            }
            Add-CleanupFailure 'Core EXE process dispose' {
              if ($null -ne $process) { $process.Dispose() }
            }
          }
          if ($null -ne $stepFailure) {
            if ($cleanupFailures.Count -gt 0) {
              $failureMessage = "Core media verification failed: $($stepFailure.Exception.Message)`nCleanup failures: $($cleanupFailures -join '; ')"
              throw [System.Exception]::new($failureMessage, $stepFailure.Exception)
            }
            throw $stepFailure.Exception
          }
          if ($cleanupFailures.Count -gt 0) {
            throw "Core media step cleanup failed: $($cleanupFailures -join '; ')"
          }
      - name: Verify portable process and worker shutdown behavior
        if: env.BUILD_PORTABLE == 'true'
        run: |
          $exe = "build/portable/$env:MANIALAB_BUILD_ID/dist/ManiaLab/ManiaLab.exe"
          .venv/Scripts/python.exe scripts/verify_shutdown.py $exe --work test-data/shutdown-ci
      - name: Collect release verification evidence
        if: success() && env.BUILD_PORTABLE == 'true'
        run: |
          $collectorArgs = @(
            '--build-root', "build/portable/$env:MANIALAB_BUILD_ID",
            '--pytest-report', 'test-data/release-ci/junit.xml',
            '--portable-report', 'test-data/portable-ci/report.json',
            '--shutdown-report', 'test-data/shutdown-ci/report.json'
          )
          if ($env:PORTABLE_PROFILE -eq 'core') {
            $collectorArgs += @(
              '--core-media-report', 'test-data/core-media-ci/report.json',
              '--core-media-service-binding-report', 'test-data/core-media-ci/service-binding.json'
            )
          }
          .venv/Scripts/python.exe scripts/collect_release_validation.py @collectorArgs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Save portable verification report
        if: always() && env.BUILD_PORTABLE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-verification
          path: |
            test-data/portable-ci/report.json
            test-data/portable-ci/launch-*.log
            test-data/shutdown-ci/report.json
            test-data/shutdown-ci/launch.log
            test-data/core-media-ci/report.json
            test-data/core-media-ci/service-binding.json
            test-data/core-media-ci/launch.stdout.log
            test-data/core-media-ci/launch.stderr.log
            test-data/core-media-ci/probe.stdout.log
            test-data/core-media-ci/probe.stderr.log
            test-data/release-ci/junit.xml
          retention-days: 7
          if-no-files-found: ignore
      - name: Save verified build
        if: success() && env.BUILD_PORTABLE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ManiaLab-windows-x64
          path: build/portable/${{ github.run_id }}-${{ github.run_attempt }}/release/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
